name: ci-tests
on: [workflow_dispatch]
permissions: {}
jobs:
  ci_tests_ubuntu:
    runs-on: ubuntu-22.04
    name: Ubuntu-22.04 Retirement Engine Tests
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - run: sudo apt-get update
      - name: Install dependencies
        run: sudo apt-get install -y gettext cmake libxslt-dev xsltproc ninja-build libboost-all-dev libgtk-3-dev guile-2.2-dev libgwengui-gtk3-dev libaqbanking-dev libofx-dev libdbi-dev libdbd-sqlite3 libwebkit2gtk-4.0-dev googletest
      - name: Configure GnuCash
        run: cmake -B build -G Ninja -DWITH_PYTHON=OFF .
      - name: Build and Test Retirement Engine
        run: |
          cmake --build build --target gnucash test-retirement-engine -j4
          ./build/bin/test-retirement-engine
